[config]
autoboot={{autoboot}}
autoboot_list=0
bootwait={{bootwait}}
backlight={{backlight}}
autohosoff={{autohosoff}}
autonogc={{autonogc}}
updater2p={{updater2p}}
bootprotect={{bootprotect}}

{--- Custom firmware ---}
[CFW (emuMMC)]
pkg3=atmosphere/package3
emummcforce=1

[CFW (sysMMC)]
pkg3=atmosphere/package3
emummc_force_disable=1

{--- Stock ---}
[Stock]
pkg3=atmosphere/package3
stock=1
emummc_force_disable=1
