dns:
  targets:
    mode:
      - block
  add_defaults:
    mode:
      - block
      - default
  debug_log:
    mode:
      - block
      - default

atmosphere:
  enable_sd_card_logging:
    enable_log_manager: true
  sd_card_log_output_directory:
    enable_log_manager: true

sys_ftpd_light:
  keycombo:
    pause: true

sys_con:
  discovery_vidpid:
    discovery_mode:
      - 1
      - 2
  network_controller_port:
    network_controller: true

status_monitor:
  left_joycon_motion_key_combo:
    motion_control: true
  right_joycon_motion_key_combo:
    motion_control: true
  pro_controller_motion_key_combo:
    motion_control: true

ultrahand:
  swipe_offset:
    swipe_to_open: true
  page_swap:
    show_packages: true
  show_package_versions:
    show_packages: true
  datetime_format:
    show_clock: true
  dynamic_widget_border:
    show_widget_border: true

dbi_general:
  TimeShowSeconds:
    TimeShow: true

dbi_mtp:
  MACasTID:
    ShowMAC: true

dbi_access_point:
  SSID:
    UseAP: true
  Password:
    UseAP: true
  Use5GHz:
    UseAP: true
  Hidden:
    UseAP: true

jksv:
  KeepLocalBackups:
    AutoUploadToRemote: true
  ZipCompressionLevel:
    ExportToZip: true
