ark:
  description: Кастомна прошивка для будь-якої моделі PSP
  details: 'Спадкоємиця PRO і ME: homebrew і плагіни, ігри з образів ISO та ігри PS1, меню відновлення й cIPL для постійного встановлення. FasterARK ставить її просто з XMB.'

update661:
  description: Офіційне оновлення прошивки від Sony
  details: Остання прошивка PSP, завантажується із серверів Sony. ARK-5 потрібна 6.60 або 6.61.
  note: Лише для PSP на старій прошивці. Перед запуском заряди батарею й підключи блок живлення.

gclite:
  description: Категорії ігор у XMB
  details: Розкладає ігри й homebrew за категоріями за теками, режим обирається в System Settings.
  note: Має завантажуватися в XMB першим, тож відкриває список плагінів.

missyhud:
  description: HUD з FPS, процесором і батареєю
  details: Показує поверх ігор FPS, навантаження й частоту процесора, пам’ять і батарею. L + R + START на секунду вмикає й вимикає його, START зі стіком рухає.

aemu:
  description: Гра мережею для ігор з adhoc
  details: 'Форк PRO Online від Kethen: ігри з локальним мультиплеєром граються через інтернет на серверах PRO Online, разом із PPSSPP.'
  note: Вкажи мережу Wi-Fi у налаштуваннях плагіна й вимкни кеші ARK.

remotejoylite:
  description: Екран PSP на комп’ютері
  details: Передає картинку PSP через USB на комп’ютер, де RemoteJoyLite показує її й передає керування назад.
  note: Програма для комп’ютера лежить у тому ж релізі на GitHub.

cmfilemanager:
  description: Файловий менеджер
  details: Копіює, переміщує й видаляє файли, розпаковує архіви, показує картинки й грає музику.

daedalusx64:
  description: Емулятор Nintendo 64
  details: Емулятор N64 для PSP з налаштуваннями для кожної гри й профілями керування.

tempgba:
  description: Емулятор Game Boy Advance
  details: Оновлений TempGBA зі швидшим динамічним рекомпілятором і запуском окремих ігор.
  note: 'Потрібен BIOS: відкритий BIOS від Cult-of-GBA ставиться разом із ним, підійде й дамп власної GBA.'

gba_bios:
  description: Відкритий BIOS Game Boy Advance
  details: Вільна заміна BIOS GBA, написана з нуля, кладеться туди, де її шукає TempGBA4PSP-mod.
  note: З ним запускається більшість ігор, деяким потрібен дамп оригіналу.
