      title: Английские названия в путях
      description: Брать для имени папки название игры на американском английском.
    HoldForDeletion:
      title: Удержание для удаления
      description: Чтобы удалить бэкап, нужно три секунды держать A.
    HoldForRestoration:
      title: Удержание для восстановления
      description: Чтобы восстановить бэкап, нужно три секунды держать A.
    HoldForOverWrite:
      title: Удержание для перезаписи
      description: Чтобы перезаписать бэкап, нужно три секунды держать A.
    OnlyListMountable:
      title: Только открывающиеся сохранения
      description: Показывать только те сохранения, которые JKSV удаётся открыть при запуске.
    ListAccountSystemSaves:
      title: Системные сохранения аккаунтов
      description: Показывать системные сохранения, привязанные к аккаунту.
    AllowSystemSaveWriting:
      title: Запись в системные сохранения
      description: Разрешить восстановление системных сохранений и запись в разделы NAND. Опасно.
    ExportToZip:
      title: Экспорт в ZIP
      description: Упаковывать бэкапы в архивы ZIP, а не складывать папками.
    ZipCompressionLevel:
      title: Сжатие ZIP
      description: От 0, без сжатия, до 9. Низкие уровни пакуют быстрее, но экономят меньше места.
    TitleSortType:
      title: Порядок игр
      description: Как отсортирован список игр.
      values:
        '0': По алфавиту
        '1': По времени в игре
        '2': По последнему запуску
    JKSMTextMode:
      title: Текстовые меню
      description: Показывать игры списком, как JKSM на 3DS, а не сеткой иконок.
    ForceEnglish:
      title: Английский интерфейс
      description: Использовать английский, а не язык системы.
    ShowDevice:
      title: Сохранения устройства
      description: Загружать и показывать сохранения, общие для всех пользователей.
    ShowBCAT:
      title: Сохранения BCAT
      description: Загружать и показывать данные BCAT, через которые игры получают контент и события между обновлениями.
    ShowCache:
      title: Сохранения кэша
      description: Загружать и показывать данные кэша, где игры держат DLC и прочее.
    ShowSystem:
      title: Системные сохранения
      description: Загружать и показывать сохранения системы.
    EnableTrash:
      title: Корзина
      description: Перемещать удалённые с карты бэкапы в папку _TRASH_, а не удалять их насовсем.
    UIAnimationScaling:
      title: Скорость анимаций
      description: Длительность переходов, чем меньше, тем быстрее. При 1 они мгновенные.

jksv_webdav:
  title: JKSV, WebDAV
  description: Сервер WebDAV, на котором JKSV хранит бэкапы.
  options:
    origin:
      title: Сервер
      description: Адрес сервера вместе с протоколом, например https://example.com. Если пусто, WebDAV выключен.
    basepath:
      title: Папка
      description: Путь к папке на сервере, куда складываются бэкапы.
    username:
      title: Логин
      description: Имя пользователя для подключения. Оставь пустым для сервера, открытого всем.
    password:
      title: Пароль
      description: Пароль для подключения.

amiigo:
  title: Amiigo
  description: Как Amiigo создаёт виртуальные amiibo для emuiibo.
  options:
    categoryMode:
      title: Папка новых amiibo
      description: Куда в emuiibo/amiibo попадает созданная amiibo.
      values:
        '0': В корень
        '1': По играм
        '2': По сериям amiibo
        '3': В папку, открытую в Amiigo
    useRandomisedUUID:
      title: Случайный UUID
      description: Созданные amiibo меняют UUID при каждом сканировании, и игра, которая принимает amiibo раз в день, принимает её снова.
    saveAmiiboImages:
      title: Картинки amiibo
      description: Скачивать картинки созданных amiibo для оверлея emuiibo. Экспериментально, большая картинка может уронить оверлей.
